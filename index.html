<!DOCTYPE html>
<html>

<head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet" type="text/css">
    <link rel="stylesheet" href="style.css" type="text/css" media="screen" charset="utf-8">
</head>

<body>
    <figure>
        <img src="./eisenhower-matrix.jpg" alt="Eisenhower Matrix">
        <figcaption><a class="more_inf" href="https://goal-life.com/page/method/matrix-eisenhower">Want more
                details&quest;</a></figcaption>
    </figure>

    <main>
        <section id="task-entry">
            <label for="new-task">Add Item</label>
            <fieldset>
                <input id="new-task" class="task" type="text">
                <button>Add</button>
            </fieldset>
        </section>

        <section>
            <h2>Todo</h2>
            <ul id="incompleteTasks">
                <li>
                    <input type="checkbox">
                    <label class="task">Pay Bills</label>
                    <input type="text" class="task">
                    <button class="edit">Edit</button>
                    <button class="delete"><img src="./remove.svg" alt="Remove Task"></button>
                </li>
                <li class="editMode">
                    <input type="checkbox">
                    <label class="task">Go Shopping</label>
                    <input type="text" value="Go Shopping" class="task">
                    <button class="edit">Save</button>
                    <button class="delete"><img src="./remove.svg" alt="Remove Task"></button>
                </li>
            </ul>
        </section>

        <section>
            <h2>Completed</h2>
            <ul id="completed-tasks">
                <li>
                    <input type="checkbox" checked>
                    <label class="task">See the Doctor</label>
                    <input type="text" class="task">
                    <button class="edit">Edit</button>
                    <button class="delete"><img src="./remove.svg" alt="Remove Task"></button>
                </li>
            </ul>
        </section>
    </main>

    <script type="text/javascript" src="app.js"></script>
</body>

</html>
